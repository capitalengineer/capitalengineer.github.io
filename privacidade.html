<title>Política de privacidade – Copia Craft Apps</title>
<h1>Política de privacidade</h1>
<p>Copia Craft Apps é um aplicativo de uso pessoal para cópia de segurança.</p>
<p>Ele acessa apenas os arquivos que ele mesmo cria no Google Drive do próprio dono e não coleta, guarda nem compartilha dados de outras pessoas.</p>
